[loggers]
keys=root,bigstream,fireants

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_bigstream]
qualname=bigstream
handlers=consoleHandler
propagate=0

# FireANTs (fireants_affine / fireants_deform steps) logs several INFO lines
# per block; keep its warnings and errors only
[logger_fireants]
level=WARNING
qualname=fireants
handlers=consoleHandler
propagate=0

[handler_consoleHandler]
class=StreamHandler
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
formatter=simpleFormatter
args=('alignment.log','a')

[formatter_simpleFormatter]
format=%(asctime)s - %(threadName)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
