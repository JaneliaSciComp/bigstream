[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bigstream"
version = "5.6.1"
description = "Tools for distributed alignment of massive images"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "Greg M. Fleishman", email = "greg.nli10me@gmail.com" }
]
dependencies = [
    "bokeh>=3.1",
    "ClusterWrap>=1.0.3",
    "dask==2026.6.0",
    "distributed==2026.6.0",
    "flatten_json==0.1.14",
    "fishspot @ git+https://github.com/GFleishman/fishspot.git@84f5b8187b",
    "h5py>=3.15.1",
    "morphsnakes>=2.0.0",
    "numcodecs>=0.16.5",
    "numpy>2,<3",
    "ngff-zarr[validate]==0.34.0",
    "opencv-python==4.12.0.88",
    "pydantic==2.12.4",
    "pynrrd>=1.1.3",
    "pyyaml==6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.16.3",
    "SimpleITK==3.0.0b1",
    "tensorstore==0.1.84",
    "tifffile[all]==2026.6.1",
    "toolz==1.1.0",
    "zarr==3.2.1",
]

[project.urls]
"Bug Tracker" = "https://github.com/JaneliaScicomp/bigstream/issues"

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = [
    "."
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

# conda packages - same as conda-env.yaml; everything else comes from
# [project.dependencies] through PyPI
[tool.pixi.dependencies]
python = "3.12.*"
psutil = "7.2.2.*"
zstd = "*"

[tool.pixi.pypi-options]
index-url = "https://pypi.org/simple"
# SimpleITK 3.0.0b1 is not on PyPI - pick it up from the GitHub release assets
find-links = [
    { url = "https://github.com/SimpleITK/SimpleITK/releases/expanded_assets/v3.0.0b1" },
]

[tool.pixi.pypi-dependencies]
bigstream = { path = ".", editable = true }
zarr-tools = { git = "https://github.com/JaneliaSciComp/zarr-tools.git", rev = "525e55a" }

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest {{ tests }}", args = [{ arg = "tests", default = "tests" }] }
