[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bigstream"
version = "5.3.0"
description = "Tools for distributed alignment of massive images"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Greg M. Fleishman", email = "greg.nli10me@gmail.com" }
]
dependencies = [
    "ClusterWrap>=1.0.3",
    "dask>=2025.11.0",
    "distributed>=2025.11.0",
    "flatten_json==0.1.14",
    "fishspot @ git+https://github.com/GFleishman/fishspot.git@84f5b8187b",
    "h5py>=3.15.1",
    "imagecodecs==2026.1.14",
    "morphsnakes>=2.0.0",
    "numcodecs>=0.16.5",
    "numpy>2,<3",
    "ngff-zarr[validate]==0.34.0",
    "opencv-python==4.12.0.88",
    "pydantic==2.12.4",
    "pynrrd>=1.1.3",
    "pyyaml==6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.16.3",
    "SimpleITK>=2.5.3",
    "tensorstore==0.1.81",
    "tifffile>=2025.10.16",
    "toolz==1.1.0",
    "zarr==3.2.1",
]

[project.urls]
"Bug Tracker" = "https://github.com/JaneliaScicomp/bigstream/issues"

[tool.setuptools.packages.find]
where = [
    "."
]
